<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-labelledby="title desc">
<title id="title">La proprietà distributiva con i diagrammi di Venn</title><desc id="desc">Due diagrammi con tre cerchi X, Y, Z: a sinistra è grigia la parte di X che sta in Y oppure in Z; a destra sono grigie X∩Y e X∩Z: le zone grigie coincidono.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<clipPath id="cx0"><circle cx="150" cy="66" r="44"/></clipPath>
<g clip-path="url(#cx0)"><circle cx="120" cy="116" r="44" fill="#e4e4e4"/><circle cx="180" cy="116" r="44" fill="#e4e4e4"/></g>
<circle cx="150" cy="66" r="44" fill="none" stroke="#111" stroke-width="1"/>
<circle cx="120" cy="116" r="44" fill="none" stroke="#111" stroke-width="1"/>
<circle cx="180" cy="116" r="44" fill="none" stroke="#111" stroke-width="1"/>
<clipPath id="cx1"><circle cx="450" cy="66" r="44"/></clipPath>
<circle cx="420" cy="116" r="44" fill="#e4e4e4" clip-path="url(#cx1)"/>
<circle cx="480" cy="116" r="44" fill="#e4e4e4" clip-path="url(#cx1)"/>
<circle cx="450" cy="66" r="44" fill="none" stroke="#111" stroke-width="1"/>
<circle cx="420" cy="116" r="44" fill="none" stroke="#111" stroke-width="1"/>
<circle cx="480" cy="116" r="44" fill="none" stroke="#111" stroke-width="1"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="150" y="16" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">X</tspan></text>
<text x="64" y="146" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">Y</tspan></text>
<text x="236" y="146" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">Z</tspan></text>
<text x="150" y="192" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">X</tspan> ∩ (<tspan font-style="italic">Y</tspan> ∪ <tspan font-style="italic">Z</tspan>)</text>
<text x="450" y="16" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">X</tspan></text>
<text x="364" y="146" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">Y</tspan></text>
<text x="536" y="146" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">Z</tspan></text>
<text x="450" y="192" font-size="14" text-anchor="middle" fill="#111">(<tspan font-style="italic">X</tspan> ∩ <tspan font-style="italic">Y</tspan>) ∪ (<tspan font-style="italic">X</tspan> ∩ <tspan font-style="italic">Z</tspan>)</text>
<text x="300" y="110" font-size="22" text-anchor="middle" fill="#111">=</text>
</g>
</svg>
