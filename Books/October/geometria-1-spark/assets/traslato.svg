<svg xmlns="http://www.w3.org/2000/svg" width="340" height="158" viewBox="0 0 340 158" role="img" aria-labelledby="title desc">
<title id="title">Le soluzioni di Ax = b: un traslato del nucleo</title><desc id="desc">La retta S0 delle soluzioni del sistema omogeneo passa per l&#x27;origine; la retta S delle soluzioni di Ax = b è parallela e passa per una soluzione particolare ξ.</desc>
