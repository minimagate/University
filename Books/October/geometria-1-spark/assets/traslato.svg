<g stroke-linecap="round" stroke-linejoin="round">
<line x1="15" y1="112" x2="325" y2="112" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="110" y1="154" x2="110" y2="8" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="25.05" y1="141.73" x2="308.21" y2="42.63" stroke="#111" stroke-width="1.2"/>
<line x1="25.37" y1="77.82" x2="204.7" y2="15.05" stroke="#111" stroke-width="1.9"/>
<line x1="110" y1="112" x2="82" y2="58" stroke="#111" stroke-width="1.1" marker-end="url(#ah)"/>
<circle cx="82" cy="58" r="3.4" fill="#111" stroke="none" stroke-width="0"/>
<line x1="110" y1="112" x2="194.95" y2="82.27" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="82" y1="58" x2="166.95" y2="28.27" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<circle cx="166.95" cy="28.27" r="3.2" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="68" y="62" font-size="15" text-anchor="middle" fill="#111">ξ</text>
<text x="196.95" y="100.27" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">x</tspan>₀</text>
<text x="180.95" y="50.27" font-size="14" text-anchor="middle" fill="#111">ξ + <tspan font-style="italic">x</tspan>₀</text>
<text x="270.46" y="77.84" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">S</tspan>₀ = <tspan font-style="italic">ker</tspan> <tspan font-style="italic">A</tspan></text>
<text x="255" y="30" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">S</tspan> = ξ + <tspan font-style="italic">S</tspan>₀</text>
</g>
</svg>
