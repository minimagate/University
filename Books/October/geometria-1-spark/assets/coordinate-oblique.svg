<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" role="img" aria-labelledby="title desc">
<title id="title">Coordinate rispetto a un riferimento obliquo</title><desc id="desc">Due vettori v1 e v2 non allineati e la griglia obliqua che generano; il vettore OP si scompone come 2 v1 + 1,5 v2 seguendo il parallelogramma.</desc>
