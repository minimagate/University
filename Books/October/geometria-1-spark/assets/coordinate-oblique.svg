<g stroke-linecap="round" stroke-linejoin="round">
<line x1="-10" y1="235" x2="110" y2="25" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="70" y1="235" x2="190" y2="25" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="150" y1="235" x2="270" y2="25" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="230" y1="235" x2="350" y2="25" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="310" y1="235" x2="430" y2="25" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="390" y1="235" x2="510" y2="25" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="26" y1="200" x2="426" y2="200" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="66" y1="130" x2="466" y2="130" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="106" y1="60" x2="506" y2="60" stroke="#c4c4c4" stroke-width="0.5"/>
<line x1="250" y1="200" x2="310" y2="95" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="150" y1="95" x2="310" y2="95" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="90" y1="200" x2="170" y2="200" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="90" y1="200" x2="130" y2="130" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="90" y1="200" x2="310" y2="95" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<circle cx="310" cy="95" r="3.4" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="166" y="220" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan>₁</text>
<text x="114" y="130" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan>₂</text>
<text x="324" y="89" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan></text>
<text x="78" y="212" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">O</tspan></text>
<text x="330" y="240" font-size="14" text-anchor="middle" fill="#111" font-style="italic">OP = 2 v₁ + 1,5 v₂</text>
</g>
</svg>
