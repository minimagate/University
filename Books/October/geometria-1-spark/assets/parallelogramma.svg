<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220" role="img" aria-labelledby="title desc">
<title id="title">Somma di vettori e prodotto per scalare</title><desc id="desc">A sinistra la regola del parallelogramma per u + v, che non cambia scambiando u e v. A destra un vettore v e i suoi multipli 2v, v/2 e −v sulla stessa retta.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<polygon points="40,180 230,150 300,30 110,60" fill="#e4e4e4" stroke="none" stroke-width="1"/>
<line x1="230" y1="150" x2="300" y2="30" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="110" y1="60" x2="300" y2="30" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="40" y1="180" x2="230" y2="150" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="40" y1="180" x2="110" y2="60" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="40" y1="180" x2="300" y2="30" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<line x1="338" y1="199.2" x2="620" y2="30" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="5 4"/>
<line x1="470" y1="120" x2="590" y2="48" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="470" y1="120" x2="530" y2="84" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<line x1="470" y1="146" x2="500" y2="128" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="470" y1="120" x2="410" y2="156" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<circle cx="470" cy="120" r="2.8" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="234" y="168" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">u</tspan></text>
<text x="96" y="60" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan></text>
<text x="310" y="18" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">u</tspan> + <tspan font-style="italic">v</tspan> = <tspan font-style="italic">v</tspan> + <tspan font-style="italic">u</tspan></text>
<text x="600" y="42" font-size="15" text-anchor="middle" fill="#111">2<tspan font-style="italic">v</tspan></text>
<text x="526" y="70" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan></text>
<text x="518" y="140" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan>/2</text>
<text x="402" y="176" font-size="15" text-anchor="middle" fill="#111">−<tspan font-style="italic">v</tspan></text>
</g>
</svg>
