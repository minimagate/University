<svg xmlns="http://www.w3.org/2000/svg" width="560" height="155" viewBox="0 0 560 155" role="img" aria-labelledby="title desc">
<title id="title">Due termini consecutivi in un passo di Fibonacci</title><desc id="desc">Prima x vale 3 e y vale 2. Dopo il passo x vale 5 e y vale 3. Il temporaneo conserva il vecchio x, che diventa il nuovo y.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="60" y="58" width="70" height="36" fill="white" stroke="#111" stroke-width="1"/>
<rect x="130" y="58" width="70" height="36" fill="white" stroke="#111" stroke-width="1"/>
<rect x="360" y="58" width="70" height="36" fill="white" stroke="#111" stroke-width="1"/>
<rect x="430" y="58" width="70" height="36" fill="white" stroke="#111" stroke-width="1"/>
<line x1="214" y1="76" x2="346" y2="76" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="130" y="30" font-size="14" text-anchor="middle" fill="#111">prima</text>
<text x="430" y="30" font-size="14" text-anchor="middle" fill="#111">dopo</text>
<text x="95" y="70" font-size="11" text-anchor="middle" fill="#111">x</text>
<text x="95" y="87" font-size="15" text-anchor="middle" fill="#111">3</text>
<text x="165" y="70" font-size="11" text-anchor="middle" fill="#111">y</text>
<text x="165" y="87" font-size="15" text-anchor="middle" fill="#111">2</text>
<text x="395" y="70" font-size="11" text-anchor="middle" fill="#111">x</text>
<text x="395" y="87" font-size="15" text-anchor="middle" fill="#111">5</text>
<text x="465" y="70" font-size="11" text-anchor="middle" fill="#111">y</text>
<text x="465" y="87" font-size="15" text-anchor="middle" fill="#111">3</text>
<text x="280" y="64" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">x</tspan>+<tspan font-style="italic">y</tspan></text>
<text x="280" y="126" font-size="14" text-anchor="middle" fill="#111">temp conserva il vecchio x = 3</text>
</g>
</svg>
