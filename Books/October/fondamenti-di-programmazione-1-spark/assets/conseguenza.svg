<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">Conseguenza logica: Γ ⊨ φ e Γ ⊭ φ</title><desc id="desc">Due pannelli dentro il rettangolo di tutte le interpretazioni. A sinistra i modelli di Γ sono contenuti nei modelli di φ, quindi Γ ⊨ φ. A destra un modello di Γ non è modello di φ, quindi Γ ⊭ φ.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="10" y="10" width="620" height="275" fill="none" stroke="#111" stroke-width="1"/>
<ellipse cx="160" cy="140" rx="115" ry="75" fill="none" stroke="#111" stroke-width="1"/>
<ellipse cx="140" cy="152" rx="62" ry="40" fill="#e4e4e4" stroke="#111" stroke-width="1"/>
<ellipse cx="430" cy="150" rx="85" ry="55" fill="#e4e4e4" stroke="#111" stroke-width="1"/>
<ellipse cx="500" cy="150" rx="85" ry="55" fill="white" stroke="#111" stroke-width="1"/>
<circle cx="385" cy="128" r="3.2" fill="#111" stroke="none" stroke-width="0"/>
<line x1="385" y1="134" x2="385" y2="222" stroke="#111" stroke-width="0.7"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="24" y="32" font-size="13" text-anchor="start" fill="#111" font-style="italic">tutte le interpretazioni</text>
<text x="160" y="90" font-size="13" text-anchor="middle" fill="#111">modelli di φ</text>
<text x="140" y="157" font-size="13" text-anchor="middle" fill="#111">modelli di Γ</text>
<text x="160" y="254" font-size="14" text-anchor="middle" fill="#111">Γ ⊨ <tspan font-style="italic">φ</tspan></text>
<text x="378" y="156" font-size="15" text-anchor="middle" fill="#111">Γ</text>
<text x="545" y="156" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">φ</tspan></text>
<text x="385" y="238" font-size="12" text-anchor="middle" fill="#111">controesempio</text>
<text x="430" y="262" font-size="14" text-anchor="middle" fill="#111">Γ ⊭ <tspan font-style="italic">φ</tspan></text>
</g>
</svg>
