<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="55" y="30" font-size="14" text-anchor="middle" fill="#111">1</text>
<text x="85" y="30" font-size="14" text-anchor="middle" fill="#111">3</text>
<text x="115" y="30" font-size="14" text-anchor="middle" fill="#111">5</text>
<text x="145" y="30" font-size="14" text-anchor="middle" fill="#111">7</text>
<text x="175" y="30" font-size="14" text-anchor="middle" fill="#111">9</text>
<text x="330" y="95" font-size="16" text-anchor="middle" fill="#111">1 + 3 + 5 + 7 + 9</text>
<text x="330" y="125" font-size="16" text-anchor="middle" fill="#111">= 5<tspan baseline-shift="38%" font-size="11.2">2</tspan></text>
<text x="330" y="160" font-size="13" text-anchor="middle" fill="#111" font-style="italic">ogni cornice aggiunge</text>
