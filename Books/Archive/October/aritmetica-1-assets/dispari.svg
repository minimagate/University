<g stroke-linecap="round" stroke-linejoin="round">
<rect x="40" y="40" width="30" height="30" fill="white" stroke="#111" stroke-width="0.7"/>
<rect x="70" y="40" width="30" height="30" fill="#e4e4e4" stroke="#111" stroke-width="0.7"/>
