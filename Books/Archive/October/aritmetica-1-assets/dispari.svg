<svg xmlns="http://www.w3.org/2000/svg" width="470" height="210" viewBox="0 0 470 210" role="img" aria-labelledby="title desc">
<title id="title">La somma dei dispari</title><desc id="desc">Un quadrato 5 per 5 diviso in cornici a forma di L di 1, 3, 5, 7, 9 caselle, alternativamente grigie e bianche.</desc>
