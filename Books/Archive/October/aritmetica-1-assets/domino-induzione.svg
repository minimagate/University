<svg xmlns="http://www.w3.org/2000/svg" width="620" height="200" viewBox="0 0 620 200" role="img" aria-labelledby="title desc">
<title id="title">Le tessere del domino</title><desc id="desc">Una fila di tessere: le prime sono già cadute, le altre stanno per cadere. Sotto ogni tessera c’è la proprietà P(n).</desc>
