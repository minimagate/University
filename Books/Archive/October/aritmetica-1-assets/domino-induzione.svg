<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="396" y="125" font-size="22" text-anchor="middle" fill="#111">…</text>
<text x="48" y="179" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan>(0)</text>
<text x="106" y="179" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan>(1)</text>
<text x="164" y="179" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan>(2)</text>
<text x="222" y="179" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan>(3)</text>
<text x="280" y="179" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan>(4)</text>
<text x="338" y="179" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan>(5)</text>
<text x="464" y="179" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">n</tspan>)</text>
<text x="20" y="22" font-size="13" text-anchor="start" fill="#111" font-style="italic">il primo cade</text>
<text x="300" y="22" font-size="13" text-anchor="start" fill="#111" font-style="italic">ogni tessera fa cadere la successiva:</text>
<text x="300" y="44" font-size="14" text-anchor="start" fill="#111"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">n</tspan>) ⇒ <tspan font-style="italic">P</tspan>(<tspan font-style="italic">n</tspan>+1)</text>
