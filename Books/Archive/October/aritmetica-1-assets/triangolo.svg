<svg xmlns="http://www.w3.org/2000/svg" width="330" height="270" viewBox="0 0 330 270" role="img" aria-labelledby="title desc">
<title id="title">Le simmetrie del triangolo</title><desc id="desc">Un triangolo equilatero con vertici 1, 2, 3, tre assi di riflessione tratteggiati e una freccia di rotazione di un terzo di giro attorno al centro.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="165" y1="33.16" x2="165" y2="220.84" stroke="#666" stroke-width="0.6" stroke-dasharray="4 4"/>
<line x1="266.19" y1="208.42" x2="103.65" y2="114.58" stroke="#666" stroke-width="0.6" stroke-dasharray="4 4"/>
<line x1="63.81" y1="208.42" x2="226.35" y2="114.58" stroke="#666" stroke-width="0.6" stroke-dasharray="4 4"/>
<polygon points="165,58 244.67,196 85.33,196" fill="#e4e4e4" stroke="#111" stroke-width="1.1"/>
<path d="M172.4,120.9 A30,30 0 0 1 192.9,160.9" fill="none" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<circle cx="165" cy="150" r="2.2" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="165" y="41" font-size="15" text-anchor="middle" fill="#111">1</text>
<text x="263.73" y="212" font-size="15" text-anchor="middle" fill="#111">2</text>
<text x="66.27" y="212" font-size="15" text-anchor="middle" fill="#111">3</text>
<text x="159" y="174" font-size="12" text-anchor="end" fill="#111" font-style="italic">120°</text>
</g>
</svg>
