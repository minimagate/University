<svg xmlns="http://www.w3.org/2000/svg" width="620" height="175" viewBox="0 0 620 175" role="img" aria-labelledby="title desc">
<title id="title">Gruppi, anelli, campi</title><desc id="desc">Tre riquadri collegati da frecce: gruppo, anello, campo, con le regole aggiunte a ogni passo ed esempi.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="14" y="20" width="176" height="100" fill="none" stroke="#111" stroke-width="1" rx="8"/>
<rect x="222" y="20" width="176" height="100" fill="none" stroke="#111" stroke-width="1" rx="8"/>
<rect x="430" y="20" width="176" height="100" fill="none" stroke="#111" stroke-width="1" rx="8"/>
<line x1="192" y1="70" x2="220" y2="70" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="400" y1="70" x2="428" y2="70" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="102" y="46" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Gruppo</text>
<text x="102" y="70" font-size="13" text-anchor="middle" fill="#111" font-style="italic">un’operazione</text>
<text x="102" y="88" font-size="13" text-anchor="middle" fill="#111" font-style="italic">neutro e inversi</text>
<text x="102" y="150" font-size="13" text-anchor="middle" fill="#111">(ℤ, +),  ℤ/<tspan font-style="italic">n</tspan>,  <tspan font-style="italic">S</tspan><tspan font-style="italic" baseline-shift="-28%" font-size="9.1">n</tspan></text>
<text x="310" y="46" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Anello</text>
<text x="310" y="70" font-size="13" text-anchor="middle" fill="#111" font-style="italic">somma e prodotto</text>
<text x="310" y="88" font-size="13" text-anchor="middle" fill="#111" font-style="italic">distributività</text>
<text x="310" y="150" font-size="13" text-anchor="middle" fill="#111">ℤ,  ℤ/6,  ℤ/8</text>
<text x="518" y="46" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Campo</text>
<text x="518" y="70" font-size="13" text-anchor="middle" fill="#111" font-style="italic">si divide per ogni</text>
<text x="518" y="88" font-size="13" text-anchor="middle" fill="#111" font-style="italic">elemento non nullo</text>
<text x="518" y="150" font-size="13" text-anchor="middle" fill="#111">ℚ,  ℝ,  ℤ/5,  ℤ/<tspan font-style="italic">p</tspan></text>
<text x="206" y="150" font-size="1" text-anchor="middle" fill="#111"></text>
<text x="206" y="140" font-size="1" text-anchor="middle" fill="#111"></text>
</g>
</svg>
