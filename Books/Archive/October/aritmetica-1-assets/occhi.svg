<text x="110" y="32" font-size="13" text-anchor="middle" fill="#111" font-style="italic">primi 2</text>
<text x="170" y="172" font-size="13" text-anchor="middle" fill="#111" font-style="italic">ultimi 2</text>
<text x="140" y="15" font-size="13" text-anchor="middle" fill="#111" font-style="italic">tre persone: c’è un ponte</text>
