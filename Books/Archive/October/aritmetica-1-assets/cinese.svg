<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240" role="img" aria-labelledby="title desc">
<title id="title">Riempire la griglia dei resti</title><desc id="desc">A sinistra una griglia 3 per 5: i numeri da 0 a 14, messi nella casella dei loro resti, la riempiono tutta. A destra una griglia 2 per 4: i numeri da 0 a 7 cadono a coppie in metà delle caselle e le altre restano vuote.</desc>
