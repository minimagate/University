<svg xmlns="http://www.w3.org/2000/svg" width="620" height="150" viewBox="0 0 620 150" role="img" aria-labelledby="title desc">
<title id="title">La completezza separa due insiemi</title><desc id="desc">Sopra: un insieme A a sinistra di un insieme B sulla retta reale, con un punto c fra i due. Sotto: in Q gli insiemi definiti da x^2 ≤ 2 e x^2 ≥ 2 lasciano un buco in radice di 2.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="20" y1="48" x2="600" y2="48" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<line x1="60" y1="48" x2="140" y2="48" stroke="#777" stroke-width="4.5"/>
<line x1="170" y1="48" x2="250" y2="48" stroke="#777" stroke-width="4.5"/>
<circle cx="290" cy="48" r="3" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="320" cy="48" r="3" fill="#111" stroke="none" stroke-width="0"/>
<line x1="380" y1="48" x2="470" y2="48" stroke="#777" stroke-width="4.5"/>
<line x1="500" y1="48" x2="570" y2="48" stroke="#777" stroke-width="4.5"/>
<line x1="352" y1="38" x2="352" y2="58" stroke="#111" stroke-width="1.4"/>
<line x1="20" y1="115" x2="600" y2="115" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<line x1="60" y1="115" x2="304" y2="115" stroke="#777" stroke-width="4.5"/>
<line x1="316" y1="115" x2="570" y2="115" stroke="#777" stroke-width="4.5"/>
<circle cx="310" cy="115" r="5" fill="white" stroke="#111" stroke-width="0.9"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="608" y="40" font-size="14" text-anchor="middle" fill="#111">ℝ</text>
<text x="160" y="34" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">A</tspan></text>
<text x="480" y="34" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">B</tspan></text>
<text x="352" y="74" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">c</tspan></text>
<text x="608" y="107" font-size="14" text-anchor="middle" fill="#111">ℚ</text>
<text x="180" y="101" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">x</tspan><tspan baseline-shift="38%" font-size="9.1">2</tspan> ≤ 2</text>
<text x="450" y="101" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">x</tspan><tspan baseline-shift="38%" font-size="9.1">2</tspan> ≥ 2</text>
<text x="310" y="141" font-size="13" text-anchor="middle" fill="#111">√2 ∉ ℚ</text>
</g>
</svg>
