<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170" role="img" aria-labelledby="title desc">
<title id="title">La catena delle tolleranze</title><desc id="desc">Tre rette verticali: un intervallo di raggio δ2 attorno a x0 è mandato da f dentro quello di raggio δ1 attorno a f(x0), che g manda dentro quello di raggio ε.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="90" y1="20" x2="90" y2="150" stroke="#111" stroke-width="0.8"/>
<rect x="83" y="57" width="14" height="56" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<circle cx="90" cy="85" r="2.6" fill="#111" stroke="none" stroke-width="0"/>
<line x1="300" y1="20" x2="300" y2="150" stroke="#111" stroke-width="0.8"/>
<rect x="293" y="43" width="14" height="84" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<circle cx="300" cy="85" r="2.6" fill="#111" stroke="none" stroke-width="0"/>
<line x1="510" y1="20" x2="510" y2="150" stroke="#111" stroke-width="0.8"/>
<rect x="503" y="49" width="14" height="72" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<circle cx="510" cy="85" r="2.6" fill="#111" stroke="none" stroke-width="0"/>
<path d="M110,42 Q195,-0.5 280,42" fill="none" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<path d="M320,42 Q405,-0.5 490,42" fill="none" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="106" y="90" font-size="13" text-anchor="start" fill="#111"><tspan font-style="italic">x</tspan><tspan baseline-shift="-28%" font-size="9.1">0</tspan></text>
<text x="76" y="75" font-size="12" text-anchor="end" fill="#111"><tspan font-style="italic">δ</tspan><tspan baseline-shift="-28%" font-size="8.4">2</tspan></text>
<text x="316" y="90" font-size="13" text-anchor="start" fill="#111"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan><tspan baseline-shift="-28%" font-size="9.1">0</tspan>)</text>
<text x="286" y="68" font-size="12" text-anchor="end" fill="#111"><tspan font-style="italic">δ</tspan><tspan baseline-shift="-28%" font-size="8.4">1</tspan></text>
<text x="526" y="90" font-size="13" text-anchor="start" fill="#111"><tspan font-style="italic">g</tspan>(<tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan><tspan baseline-shift="-28%" font-size="9.1">0</tspan>))</text>
<text x="496" y="71" font-size="12" text-anchor="end" fill="#111"><tspan font-style="italic">ε</tspan></text>
<text x="195" y="14" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">f</tspan></text>
<text x="405" y="14" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">g</tspan></text>
<text x="300" y="165" font-size="12" text-anchor="middle" fill="#111" font-style="italic">la sfida ε su g diventa la sfida δ₁ su f</text>
</g>
</svg>
