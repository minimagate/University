<svg xmlns="http://www.w3.org/2000/svg" width="560" height="105" viewBox="0 0 560 105" role="img" aria-labelledby="title desc">
<title id="title">Punto di accumulazione e punto isolato</title><desc id="desc">Sulla retta l’insieme D = (0,1] unito a {2}; intorni di 0 e di 2 tratteggiati.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="20" y1="50" x2="540" y2="50" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<line x1="70" y1="50" x2="260" y2="50" stroke="#777" stroke-width="4"/>
<circle cx="70" cy="50" r="4" fill="white" stroke="#111" stroke-width="0.9"/>
<circle cx="260" cy="50" r="4" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="450" cy="50" r="4" fill="#111" stroke="none" stroke-width="0"/>
<path d="M28.2,36 L28.2,64" fill="none" stroke="#111" stroke-width="0.8" stroke-dasharray="3 2" />
<path d="M111.8,36 L111.8,64" fill="none" stroke="#111" stroke-width="0.8" stroke-dasharray="3 2" />
<path d="M408.2,36 L408.2,64" fill="none" stroke="#111" stroke-width="0.8" stroke-dasharray="3 2" />
<path d="M491.8,36 L491.8,64" fill="none" stroke="#111" stroke-width="0.8" stroke-dasharray="3 2" />
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="70" y="80" font-size="13" text-anchor="middle" fill="#111">0</text>
<text x="260" y="80" font-size="13" text-anchor="middle" fill="#111">1</text>
<text x="450" y="80" font-size="13" text-anchor="middle" fill="#111">2</text>
<text x="70" y="28" font-size="11" text-anchor="middle" fill="#111" font-style="italic">di accumulazione</text>
<text x="450" y="28" font-size="11" text-anchor="middle" fill="#111" font-style="italic">isolato</text>
<text x="165" y="38" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">D</tspan></text>
</g>
</svg>
