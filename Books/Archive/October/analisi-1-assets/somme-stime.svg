<text x="56" y="44" font-size="12" text-anchor="end" fill="#111">1/6</text>
<text x="56" y="119" font-size="12" text-anchor="end" fill="#111">1/12</text>
<text x="444" y="208" font-size="13" text-anchor="start" fill="#111"><tspan font-style="italic">k</tspan></text>
</g>
