<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
<title id="title">Stimare una somma</title><desc id="desc">Sette colonne di altezza 1/k per k da 6 a 12, comprese fra un rettangolo basso di altezza 1/12 e uno alto di altezza 1/6.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="60" y1="190" x2="464" y2="190" stroke="#111" stroke-width="0.9"/>
<rect x="74" y="40" width="44" height="150" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<rect x="126" y="61.43" width="44" height="128.57" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<rect x="178" y="77.5" width="44" height="112.5" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<rect x="230" y="90" width="44" height="100" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<rect x="282" y="100" width="44" height="90" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<rect x="334" y="108.18" width="44" height="81.82" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<rect x="386" y="115" width="44" height="75" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<rect x="70" y="40" width="364" height="150" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="70" y="115" width="364" height="75" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="2 2"/>
</g>
