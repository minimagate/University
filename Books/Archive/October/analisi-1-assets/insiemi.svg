<svg xmlns="http://www.w3.org/2000/svg" width="600" height="175" viewBox="0 0 600 175" role="img" aria-labelledby="title desc">
<title id="title">Intersezione, unione, differenza</title><desc id="desc">Tre coppie di cerchi A e B: in grigio A intersezione B, A unione B, A meno B.</desc>
