<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
<title id="title">Rafforzare la precondizione e indebolire la postcondizione</title><desc id="desc">A sinistra {P} è contenuta in {P′}, a destra {R′} è contenuta in {R}: la tripla {P′} C {R′} implica {P} C {R} grazie alle due regole della conseguenza.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="150" cy="120" rx="115" ry="80" fill="none" stroke="#111" stroke-width="1"/>
<ellipse cx="150" cy="125" rx="60" ry="38" fill="none" stroke="#111" stroke-width="1"/>
<ellipse cx="490" cy="120" rx="115" ry="80" fill="none" stroke="#111" stroke-width="1"/>
<ellipse cx="490" cy="125" rx="60" ry="38" fill="none" stroke="#111" stroke-width="1"/>
<line x1="268" y1="120" x2="428" y2="120" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="60" y="70" font-size="14" text-anchor="middle" fill="#111">{<tspan font-style="italic">P</tspan>′}</text>
<text x="150" y="130" font-size="14" text-anchor="middle" fill="#111">{<tspan font-style="italic">P</tspan>}</text>
<text x="580" y="70" font-size="14" text-anchor="middle" fill="#111">{<tspan font-style="italic">R</tspan>}</text>
<text x="490" y="130" font-size="14" text-anchor="middle" fill="#111">{<tspan font-style="italic">R</tspan>′}</text>
<text x="348" y="112" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">C</tspan></text>
<text x="150" y="228" font-size="13" text-anchor="middle" fill="#111" font-style="italic">rafforzare la precondizione</text>
<text x="490" y="228" font-size="13" text-anchor="middle" fill="#111" font-style="italic">indebolire la postcondizione</text>
</g>
</svg>
