<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
<title id="title">Il ciclo di sviluppo di un programma</title><desc id="desc">Quattro fasi in sequenza (specifica, algoritmo, codifica, esecuzione), con ritorni curvi dall’esecuzione verso le fasi precedenti, etichettati debugging.</desc>
