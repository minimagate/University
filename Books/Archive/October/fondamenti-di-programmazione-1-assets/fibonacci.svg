<title id="title">Calcolo iterativo di Fibonacci con due variabili</title><desc id="desc">La sequenza di Fibonacci da 0 a 13 in celle con indici; due finestre di x e y prima e dopo un passo, con la regola temp := x; x := x + y; y := temp; i := i + 1.</desc>
