<svg xmlns="http://www.w3.org/2000/svg" width="360" height="230" viewBox="0 0 360 230" role="img" aria-labelledby="title desc">
<title id="title">La tangente non basta per l&#x27;argomento</title><desc id="desc">I punti 1 + i e −1 − i stanno sulla stessa retta per l&#x27;origine e hanno lo stesso rapporto b/a, ma i loro argomenti differiscono di π.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="30" y1="115" x2="330" y2="115" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="180" y1="215" x2="180" y2="15" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="87" y1="208" x2="273" y2="22" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="5 4"/>
<line x1="180" y1="115" x2="240" y2="55" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
<circle cx="240" cy="55" r="3.2" fill="#111" stroke="none" stroke-width="0"/>
<line x1="180" y1="115" x2="120" y2="175" stroke="#111" stroke-width="1.3" marker-end="url(#ah)"/>
<circle cx="120" cy="175" r="3.2" fill="#111" stroke="none" stroke-width="0"/>
<path d="M206,115 A26,26 0 0,0 198.4,96.6" fill="none" stroke="#111" stroke-width="0.8" />
<path d="M220,115 A40,40 0 1,0 151.7,143.3" fill="none" stroke="#111" stroke-width="0.8" stroke-dasharray="3 3" />
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="328" y="133" font-size="13" text-anchor="middle" fill="#111">Re</text>
<text x="166" y="21" font-size="13" text-anchor="middle" fill="#111">Im</text>
<text x="270" y="51" font-size="14" text-anchor="middle" fill="#111">1 + <tspan font-style="italic">i</tspan></text>
<text x="86" y="189" font-size="14" text-anchor="middle" fill="#111">−1 − <tspan font-style="italic">i</tspan></text>
<text x="228" y="107" font-size="12" text-anchor="middle" fill="#111"><tspan font-style="italic">π</tspan>/4</text>
<text x="150" y="67" font-size="12" text-anchor="middle" fill="#111">5<tspan font-style="italic">π</tspan>/4</text>
</g>
</svg>
