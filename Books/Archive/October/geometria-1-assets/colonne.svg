<svg xmlns="http://www.w3.org/2000/svg" width="620" height="230" viewBox="0 0 620 230" role="img" aria-labelledby="title desc">
<title id="title">Risolvere Ax = b vuol dire combinare le colonne</title><desc id="desc">A sinistra le colonne A1 e A2 non sono parallele: b si ottiene come x1 A1 + x2 A2. A destra le colonne sono parallele e generano solo una retta: se b è fuori dalla retta il sistema non ha soluzione.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="40" y1="190" x2="310" y2="190" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="60" y1="210" x2="60" y2="20" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="180" y1="160" x2="212" y2="64" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="92" y1="94" x2="212" y2="64" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="60" y1="190" x2="180" y2="160" stroke="#9a9a9a" stroke-width="0.7"/>
<line x1="60" y1="190" x2="92" y2="94" stroke="#9a9a9a" stroke-width="0.7"/>
<line x1="60" y1="190" x2="140" y2="170" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="60" y1="190" x2="80" y2="130" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="60" y1="190" x2="212" y2="64" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<line x1="350" y1="190" x2="610" y2="190" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="370" y1="210" x2="370" y2="20" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="354" y1="198" x2="594" y2="78" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="5 4"/>
<line x1="370" y1="190" x2="450" y2="150" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="370" y1="190" x2="506" y2="122" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="370" y1="190" x2="434" y2="62" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="144" y="188" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">A</tspan>₁</text>
<text x="64" y="130" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">A</tspan>₂</text>
<text x="222" y="60" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">b</tspan></text>
<text x="170" y="225" font-size="13" text-anchor="middle" fill="#111" font-style="italic">b = x₁A₁ + x₂A₂: c&#x27;è soluzione</text>
<text x="454" y="168" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">A</tspan>₁</text>
<text x="508" y="140" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">A</tspan>₂</text>
<text x="444" y="58" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">b</tspan></text>
<text x="480" y="225" font-size="13" text-anchor="middle" fill="#111" font-style="italic">colonne parallele: b irraggiungibile</text>
</g>
</svg>
