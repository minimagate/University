<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="308" y="218" font-size="13" text-anchor="middle" fill="#111">Re</text>
<text x="36" y="26" font-size="13" text-anchor="middle" fill="#111">Im</text>
<text x="188" y="164" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan></text>
