<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
<title id="title">Somma e prodotto di numeri complessi</title><desc id="desc">A sinistra la somma z + w come diagonale del parallelogramma. A destra il prodotto zw: i moduli si moltiplicano e gli argomenti si sommano.</desc>
