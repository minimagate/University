<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="title desc">
<title id="title">Una retta per l&#x27;origine è un sottospazio, una retta spostata no</title><desc id="desc">A sinistra una retta per l&#x27;origine: somme e multipli dei suoi vettori restano sulla retta. A destra una retta che non passa per l&#x27;origine: la somma di due suoi vettori esce dalla retta e il vettore nullo non vi appartiene.</desc>
