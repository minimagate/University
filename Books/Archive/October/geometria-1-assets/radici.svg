<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
<title id="title">Radici terze di −8 e radici seste di 1</title><desc id="desc">A sinistra le tre soluzioni di z^3 = −8 sulla circonferenza di raggio 2, vertici di un triangolo equilatero. A destra le sei soluzioni di z^6 = 1, vertici di un esagono regolare sulla circonferenza unitaria.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="35" y1="120" x2="265" y2="120" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="150" y1="225" x2="150" y2="15" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<circle cx="150" cy="120" r="88" fill="none" stroke="#9a9a9a" stroke-width="0.8" stroke-dasharray="4 3"/>
<polygon points="194,43.79 62,120 194,196.21" fill="#e4e4e4" stroke="#111" stroke-width="0.9"/>
<circle cx="194" cy="43.79" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="62" cy="120" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="194" cy="196.21" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
<line x1="335" y1="120" x2="565" y2="120" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="450" y1="225" x2="450" y2="15" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<circle cx="450" cy="120" r="80" fill="none" stroke="#9a9a9a" stroke-width="0.8" stroke-dasharray="4 3"/>
<polygon points="530,120 490,50.72 410,50.72 370,120 410,189.28 490,189.28" fill="#e4e4e4" stroke="#111" stroke-width="0.9"/>
<circle cx="530" cy="120" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="490" cy="50.72" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="410" cy="50.72" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="370" cy="120" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="410" cy="189.28" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="490" cy="189.28" r="3.6" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="215" y="29.74" font-size="13" text-anchor="middle" fill="#111">1 + <tspan font-style="italic">i</tspan>√3</text>
<text x="62" y="108" font-size="13" text-anchor="middle" fill="#111">−2</text>
<text x="215" y="220.26" font-size="13" text-anchor="middle" fill="#111">1 − <tspan font-style="italic">i</tspan>√3</text>
<text x="150" y="246" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan>³ = −8</text>
<text x="530" y="108" font-size="13" text-anchor="middle" fill="#111">1</text>
<text x="503" y="36.67" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan>₁</text>
<text x="397" y="36.67" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan>₂</text>
<text x="370" y="108" font-size="13" text-anchor="middle" fill="#111">−1</text>
<text x="397" y="213.33" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan>₄</text>
<text x="503" y="213.33" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan>₅</text>
<text x="450" y="246" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan>⁶ = 1</text>
</g>
</svg>
