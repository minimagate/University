<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
<title id="title">Che cosa genera una famiglia di vettori</title><desc id="desc">Tre disegni: un vettore non nullo genera una retta; due vettori non paralleli generano un piano; tre vettori complanari generano soltanto il loro piano.</desc>
