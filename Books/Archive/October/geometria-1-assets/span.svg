<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="134" y="74.4" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan></text>
<text x="90" y="190" font-size="13" text-anchor="middle" fill="#111" font-style="italic">span(v): una retta</text>
<text x="380" y="121" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">u</tspan></text>
<text x="269.6" y="131.8" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan></text>
<text x="320" y="190" font-size="13" text-anchor="middle" fill="#111" font-style="italic">span(u, v): un piano</text>
<text x="589.4" y="121" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">u</tspan></text>
<text x="488.44" y="128.92" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan></text>
<text x="559.96" y="125.68" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">w</tspan></text>
<text x="540" y="190" font-size="13" text-anchor="middle" fill="#111" font-style="italic">u, v, w complanari: ancora il piano</text>
</g>
