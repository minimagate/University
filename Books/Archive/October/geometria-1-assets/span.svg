<line x1="535" y1="105" x2="585.4" y2="105" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="535" y1="105" x2="500.44" y2="130.92" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="535" y1="105" x2="547.96" y2="127.68" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
