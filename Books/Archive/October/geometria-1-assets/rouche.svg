<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-labelledby="title desc">
<title id="title">Rouché–Capelli: aggiungere b non deve far crescere il rango</title><desc id="desc">A sinistra b sta nel piano generato dalle colonne: aggiungendolo il rango resta 2 e il sistema ha soluzione. A destra b esce dal piano: il rango sale a 3 e il sistema non ha soluzione.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<polygon points="125.52,97.46 258.12,97.46 176.52,158.66 43.92,158.66" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<line x1="150" y1="125" x2="201" y2="125" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="150" y1="125" x2="115.32" y2="151.01" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="150" y1="125" x2="167" y2="147.95" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<circle cx="150" cy="125" r="3" fill="#111" stroke="none" stroke-width="0"/>
<polygon points="425.52,97.46 558.12,97.46 476.52,158.66 343.92,158.66" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<line x1="450" y1="125" x2="501" y2="125" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="450" y1="125" x2="415.32" y2="151.01" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="450" y1="125" x2="460.2" y2="61.25" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<line x1="460.2" y1="61.25" x2="460.2" y2="132.65" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="3 3"/>
<circle cx="450" cy="125" r="3" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="207" y="141" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">a</tspan>₁</text>
<text x="101.32" y="147.01" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">a</tspan>₂</text>
<text x="179" y="147.95" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">b</tspan></text>
<text x="150" y="205" font-size="13" text-anchor="middle" fill="#111" font-style="italic">b nel piano: rango 2 = 2, compatibile</text>
<text x="507" y="141" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">a</tspan>₁</text>
<text x="401.32" y="147.01" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">a</tspan>₂</text>
<text x="472.2" y="61.25" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">b</tspan></text>
<text x="450" y="205" font-size="13" text-anchor="middle" fill="#111" font-style="italic">b fuori dal piano: rango 2 → 3, impossibile</text>
</g>
</svg>
