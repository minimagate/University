<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="title desc">
<title id="title">Tabella di P(x, y) su due elementi</title><desc id="desc">Griglia 2 per 2 dei valori di P(x, y) per x e y in {a, b}: la riga x = a è vera in entrambe le colonne, la riga x = b è falsa. Quindi x = a è un testimone di ∃x∀y P(x, y).</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="170" y="70" width="140" height="48" fill="#e4e4e4" stroke="none" stroke-width="1"/>
<rect x="170" y="70" width="70" height="48" fill="none" stroke="#111" stroke-width="1"/>
<rect x="240" y="70" width="70" height="48" fill="none" stroke="#111" stroke-width="1"/>
<rect x="170" y="118" width="70" height="48" fill="none" stroke="#111" stroke-width="1"/>
<rect x="240" y="118" width="70" height="48" fill="none" stroke="#111" stroke-width="1"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="20" y="40" font-size="15" text-anchor="start" fill="#111"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>,<tspan font-style="italic">y</tspan>)</text>
<text x="205" y="58" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">a</tspan></text>
<text x="275" y="58" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">b</tspan></text>
<text x="205" y="99" font-size="15" text-anchor="middle" fill="#111">t</text>
<text x="275" y="99" font-size="15" text-anchor="middle" fill="#111">t</text>
<text x="156" y="99" font-size="13" text-anchor="end" fill="#111"><tspan font-style="italic">x</tspan> = <tspan font-style="italic">a</tspan></text>
<text x="205" y="147" font-size="15" text-anchor="middle" fill="#111">f</text>
<text x="275" y="147" font-size="15" text-anchor="middle" fill="#111">f</text>
<text x="156" y="147" font-size="13" text-anchor="end" fill="#111"><tspan font-style="italic">x</tspan> = <tspan font-style="italic">b</tspan></text>
<text x="326" y="99" font-size="12" text-anchor="start" fill="#111">testimone: x = a</text>
</g>
</svg>
