<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
<title id="title">Portata dei quantificatori</title><desc id="desc">La formula ∀y.( z = y ∧ ( x = y ∨ ( ∃x. x = z ∨ z = y ) ) ): le tre occorrenze di y sono legate da ∀y, l’x di x = z è legata da ∃x, le z e l’x di x = y sono libere e campite in grigio.</desc>
