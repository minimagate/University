<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
<title id="title">Polarità delle occorrenze di P, R e Q</title><desc id="desc">Due alberi affiancati: in P ⇒ (¬R ⇒ Q) la lettera P è in posizione negativa, R e Q positive; in (P ⇒ ¬R) ⇒ Q la lettera P è positiva, R positiva e Q positiva.</desc>
