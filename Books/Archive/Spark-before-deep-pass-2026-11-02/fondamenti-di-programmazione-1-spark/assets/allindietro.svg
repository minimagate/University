<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img" aria-labelledby="title desc">
<title id="title">Calcolo della precondizione all’indietro</title><desc id="desc">Programma con asserzioni calcolate dal basso verso l’alto: da {x &gt; y} si risale a {x &gt; y − 1} con y := y − 1, poi a {x ≥ y − 1} con x := x + 1.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="330" y1="256" x2="330" y2="160" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="330" y1="144" x2="330" y2="48" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="40" y="40" font-size="15" text-anchor="start" fill="#111">{<tspan font-style="italic">x</tspan> ≥ <tspan font-style="italic">y</tspan>−1}</text>
<text x="70" y="96" font-size="14" text-anchor="start" fill="#111">x := x+1</text>
<text x="40" y="152" font-size="15" text-anchor="start" fill="#111">{<tspan font-style="italic">x</tspan> &gt; <tspan font-style="italic">y</tspan>−1}</text>
<text x="70" y="208" font-size="14" text-anchor="start" fill="#111">y := y−1</text>
<text x="40" y="264" font-size="15" text-anchor="start" fill="#111">{<tspan font-style="italic">x</tspan> &gt; <tspan font-style="italic">y</tspan>}</text>
<text x="342" y="210" font-size="13" text-anchor="start" fill="#111">[<tspan font-style="italic">y</tspan>−1/<tspan font-style="italic">y</tspan>]</text>
<text x="342" y="98" font-size="13" text-anchor="start" fill="#111">[<tspan font-style="italic">x</tspan>+1/<tspan font-style="italic">x</tspan>]</text>
<text x="342" y="124" font-size="12" text-anchor="start" fill="#111"><tspan font-style="italic">x</tspan>+1 &gt; <tspan font-style="italic">y</tspan>−1  ⇐  <tspan font-style="italic">x</tspan> ≥ <tspan font-style="italic">y</tspan>−1</text>
</g>
</svg>
