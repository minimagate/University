<svg xmlns="http://www.w3.org/2000/svg" width="620" height="170" viewBox="0 0 620 170" role="img" aria-labelledby="title desc">
<title id="title">Stati successivi del programma di moltiplicazione</title><desc id="desc">Quattro stati successivi delle variabili A, B e C: a ogni passo C cresce di A e B diminuisce di uno, finché B vale zero.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<rect x="50" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<rect x="80" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<line x1="116" y1="85" x2="176" y2="85" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<rect x="182" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<rect x="212" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<rect x="242" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<line x1="278" y1="85" x2="338" y2="85" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<rect x="344" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<rect x="374" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<rect x="404" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<line x1="440" y1="85" x2="500" y2="85" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<rect x="506" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<rect x="536" y="70" width="30" height="30" fill="white" stroke="#111" stroke-width="1"/>
<rect x="566" y="70" width="30" height="30" fill="#e4e4e4" stroke="#111" stroke-width="1"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="35" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">A</text>
<text x="35" y="90" font-size="14" text-anchor="middle" fill="#111">5</text>
<text x="65" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">B</text>
<text x="65" y="90" font-size="14" text-anchor="middle" fill="#111">3</text>
<text x="95" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">C</text>
<text x="95" y="90" font-size="14" text-anchor="middle" fill="#111">0</text>
<text x="65" y="122" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">σ</tspan><tspan baseline-shift="-28%" font-size="9.8">0</tspan></text>
<text x="146" y="56" font-size="11" text-anchor="middle" fill="#111">C := C+A,</text>
<text x="146" y="68" font-size="11" text-anchor="middle" fill="#111">B := B−1</text>
<text x="197" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">A</text>
<text x="197" y="90" font-size="14" text-anchor="middle" fill="#111">5</text>
<text x="227" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">B</text>
<text x="227" y="90" font-size="14" text-anchor="middle" fill="#111">2</text>
<text x="257" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">C</text>
<text x="257" y="90" font-size="14" text-anchor="middle" fill="#111">5</text>
<text x="227" y="122" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">σ</tspan><tspan baseline-shift="-28%" font-size="9.8">1</tspan></text>
<text x="308" y="56" font-size="11" text-anchor="middle" fill="#111">C := C+A,</text>
<text x="308" y="68" font-size="11" text-anchor="middle" fill="#111">B := B−1</text>
<text x="359" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">A</text>
<text x="359" y="90" font-size="14" text-anchor="middle" fill="#111">5</text>
<text x="389" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">B</text>
<text x="389" y="90" font-size="14" text-anchor="middle" fill="#111">1</text>
<text x="419" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">C</text>
<text x="419" y="90" font-size="14" text-anchor="middle" fill="#111">10</text>
<text x="389" y="122" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">σ</tspan><tspan baseline-shift="-28%" font-size="9.8">2</tspan></text>
<text x="470" y="56" font-size="11" text-anchor="middle" fill="#111">C := C+A,</text>
<text x="470" y="68" font-size="11" text-anchor="middle" fill="#111">B := B−1</text>
<text x="521" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">A</text>
<text x="521" y="90" font-size="14" text-anchor="middle" fill="#111">5</text>
<text x="551" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">B</text>
<text x="551" y="90" font-size="14" text-anchor="middle" fill="#111">0</text>
<text x="581" y="62" font-size="13" text-anchor="middle" fill="#111" font-style="italic">C</text>
<text x="581" y="90" font-size="14" text-anchor="middle" fill="#111">15</text>
<text x="551" y="122" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">σ</tspan><tspan baseline-shift="-28%" font-size="9.8">3</tspan></text>
<text x="551" y="154" font-size="12" text-anchor="middle" fill="#111" font-style="italic">B = 0: stop</text>
</g>
</svg>
