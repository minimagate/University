<title id="title">Tre interpretazioni del predicato p(x)</title><desc id="desc">Tre pannelli: nel primo i punti sono città italiane e p(x) dice che sono capoluoghi di provincia; nel secondo il dominio è {5, 10, 15} e p è sempre vero; nel terzo sono i numeri da 0 a 15 e p dice che sono multipli di 5.</desc>
