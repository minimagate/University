<svg xmlns="http://www.w3.org/2000/svg" width="640" height="140" viewBox="0 0 640 140" role="img" aria-labelledby="title desc">
<title id="title">Il ciclo while srotolato in una sequenza di stati</title><desc id="desc">Stati σ0, σ1, σ2, …, σn collegati da un’esecuzione del corpo C; la guardia E vale vero negli stati da cui si continua e falso in σn, da cui si esce.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<circle cx="60" cy="96" r="20" fill="white" stroke="#111" stroke-width="1"/>
<circle cx="170" cy="96" r="20" fill="white" stroke="#111" stroke-width="1"/>
<circle cx="280" cy="96" r="20" fill="white" stroke="#111" stroke-width="1"/>
<circle cx="500" cy="96" r="20" fill="white" stroke="#111" stroke-width="1"/>
<line x1="82" y1="96" x2="148" y2="96" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="192" y1="96" x2="258" y2="96" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="302" y1="96" x2="368" y2="96" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="412" y1="96" x2="478" y2="96" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
<line x1="520" y1="96" x2="606" y2="96" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="60" y="101" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">σ</tspan><tspan baseline-shift="-28%" font-size="9.8">0</tspan></text>
<text x="60" y="56" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">E</tspan>: <tspan font-style="italic">t</tspan></text>
<text x="170" y="101" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">σ</tspan><tspan baseline-shift="-28%" font-size="9.8">1</tspan></text>
<text x="170" y="56" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">E</tspan>: <tspan font-style="italic">t</tspan></text>
<text x="280" y="101" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">σ</tspan><tspan baseline-shift="-28%" font-size="9.8">2</tspan></text>
<text x="280" y="56" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">E</tspan>: <tspan font-style="italic">t</tspan></text>
<text x="500" y="101" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">σ</tspan><tspan font-style="italic" baseline-shift="-28%" font-size="9.8">n</tspan></text>
<text x="500" y="56" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">E</tspan>: <tspan font-style="italic">f</tspan></text>
<text x="390" y="101" font-size="18" text-anchor="middle" fill="#111">…</text>
