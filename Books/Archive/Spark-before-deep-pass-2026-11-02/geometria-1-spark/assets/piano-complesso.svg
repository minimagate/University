<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
<title id="title">Il piano complesso: modulo, argomento, coniugato</title><desc id="desc">Il numero z = a + ib è il punto (a, b); la sua distanza dall&#x27;origine è il modulo, l&#x27;angolo dal semiasse reale positivo è l&#x27;argomento; il coniugato è il punto simmetrico rispetto all&#x27;asse reale.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="50" y1="130" x2="530" y2="130" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="200" y1="245" x2="200" y2="15" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="328" y1="50" x2="328" y2="130" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="328" y1="50" x2="200" y2="50" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="328" y1="130" x2="328" y2="210" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="200" y1="130" x2="328" y2="50" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/>
<circle cx="328" cy="50" r="3.4" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="328" cy="210" r="3.4" fill="#111" stroke="none" stroke-width="0"/>
<line x1="346" y1="204" x2="354" y2="204" stroke="#111" stroke-width="0.9"/>
<path d="M234,130 A34,34 0 0,0 228.8,112.0" fill="none" stroke="#111" stroke-width="0.9" />
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="528" y="148" font-size="13" text-anchor="middle" fill="#111">Re</text>
<text x="186" y="21" font-size="13" text-anchor="middle" fill="#111">Im</text>
<text x="346" y="48" font-size="15" text-anchor="start" fill="#111"><tspan font-style="italic">z</tspan> = <tspan font-style="italic">a</tspan> + <tspan font-style="italic">ib</tspan></text>
<text x="346" y="218" font-size="15" text-anchor="start" fill="#111"><tspan font-style="italic">z</tspan></text>
<text x="358" y="218" font-size="15" text-anchor="start" fill="#111"> = <tspan font-style="italic">a</tspan> − <tspan font-style="italic">ib</tspan></text>
<text x="328" y="150" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">a</tspan></text>
<text x="186" y="55" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">b</tspan></text>
<text x="254" y="78" font-size="14" text-anchor="middle" fill="#111">|<tspan font-style="italic">z</tspan>|</text>
<text x="248" y="122" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">θ</tspan></text>
<text x="470" y="245" font-size="12" text-anchor="middle" fill="#111" font-style="italic">il coniugio è la riflessione sull&#x27;asse reale</text>
</g>
</svg>
