<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="title desc">
<title id="title">Il lemma di scambio</title><desc id="desc">Righe di caselle: una base u1, ..., u4; a ogni passo un vettore w della famiglia indipendente entra al posto di un u, e si ottiene ancora una base.</desc>
