<title id="title">Le tre operazioni elementari di riga</title><desc id="desc">Tre schemi di una matrice a tre righe: scambio di due righe, moltiplicazione di una riga per λ diverso da zero, somma a una riga di un multiplo di un&#x27;altra.</desc>
