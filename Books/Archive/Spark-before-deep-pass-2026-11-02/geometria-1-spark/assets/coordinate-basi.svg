<line x1="30" y1="95" x2="138" y2="59" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<circle cx="138" cy="59" r="3" fill="#111" stroke="none" stroke-width="0"/>
<line x1="230" y1="95" x2="420" y2="95" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="250" y1="145" x2="250" y2="20" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="322" y1="23" x2="358" y2="59" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="250" y1="95" x2="286" y2="59" stroke="#111" stroke-width="1.1" marker-end="url(#ah)"/>
<line x1="250" y1="95" x2="286" y2="131" stroke="#111" stroke-width="1.1" marker-end="url(#ah)"/>
<line x1="250" y1="95" x2="322" y2="23" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="2 3"/>
<line x1="250" y1="95" x2="358" y2="59" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<circle cx="358" cy="59" r="3" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="66" y="113" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">e</tspan>₁</text>
<text x="16" y="63" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">e</tspan>₂</text>
<text x="110" y="164" font-size="14" text-anchor="middle" fill="#111">[<tspan font-style="italic">x</tspan>]<tspan font-style="italic" baseline-shift="-28%" font-size="9.8">E</tspan> = (3, 1)</text>
<text x="150" y="59" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">x</tspan></text>
