<svg xmlns="http://www.w3.org/2000/svg" width="440" height="170" viewBox="0 0 440 170" role="img" aria-labelledby="title desc">
<title id="title">Lo stesso vettore in due basi</title><desc id="desc">Il vettore x = (3, 1). A sinistra nella base canonica ha coordinate (3, 1). A destra nella base v1 = (1, 1), v2 = (1, −1) ha coordinate (2, 1), perché x = 2 v1 + v2.</desc>
