<title id="title">Per ogni studente esiste una birra, oppure una birra per tutti</title><desc id="desc">Due diagrammi con tre studenti e tre birre. A sinistra ogni studente ha una freccia verso una birra diversa; a destra tutte le frecce vanno alla stessa birra.</desc>
