<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
<title id="title">Dai generatori all&#x27;equazione</title><desc id="desc">Il piano generato da v1 = (1, −1, 0) e v2 = (0, 1, −1) in R^3: è il piano x + y + z = 0, che contiene anche il vettore (1, 1, −2).</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="180" y1="110" x2="285.6" y2="110" stroke="#9a9a9a" stroke-width="0.7" marker-end="url(#ah)"/>
<line x1="180" y1="110" x2="111.36" y2="161.48" stroke="#9a9a9a" stroke-width="0.7" marker-end="url(#ah)"/>
<line x1="180" y1="110" x2="180" y2="13.2" stroke="#9a9a9a" stroke-width="0.7" marker-end="url(#ah)"/>
<polygon points="138.2,68.2 289.56,25.63 232.8,162.8 81.44,205.37" fill="#e4e4e4" stroke="#111" stroke-width="0.8"/>
<line x1="180" y1="110" x2="250.4" y2="90.2" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="180" y1="110" x2="153.6" y2="173.8" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/>
<circle cx="180" cy="110" r="3" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="293.6" y="114" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">x</tspan></text>
<text x="119.36" y="165.48" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">y</tspan></text>
<text x="188" y="17.2" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan></text>
<text x="260.4" y="100.2" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan>₁</text>
<text x="147.6" y="189.8" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan>₂</text>
<text x="180" y="234" font-size="13" text-anchor="middle" fill="#111" font-style="italic">span(v₁, v₂) = { x + y + z = 0 }</text>
</g>
</svg>
