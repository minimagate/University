<g stroke-linecap="round" stroke-linejoin="round">
<line x1="20" y1="85" x2="190" y2="85" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="100" y1="155" x2="100" y2="15" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="25" y1="125" x2="185" y2="39" stroke="#111" stroke-width="1.3"/>
<line x1="30" y1="30" x2="180" y2="135" stroke="#111" stroke-width="1.3"/>
<circle cx="102" cy="84" r="4" fill="#111" stroke="none" stroke-width="0"/>
<line x1="230" y1="85" x2="400" y2="85" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="310" y1="155" x2="310" y2="15" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="235" y1="110" x2="395" y2="30" stroke="#111" stroke-width="1.3"/>
<line x1="235" y1="145" x2="395" y2="65" stroke="#111" stroke-width="1.3"/>
<line x1="440" y1="85" x2="610" y2="85" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="520" y1="155" x2="520" y2="15" stroke="#9a9a9a" stroke-width="0.8" marker-end="url(#ah)"/>
<line x1="445" y1="125" x2="605" y2="45" stroke="#9a9a9a" stroke-width="2.6"/>
