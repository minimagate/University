<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" role="img" aria-labelledby="title desc">
<title id="title">Due equazioni in due incognite: tre casi</title><desc id="desc">Tre coppie di rette: incidenti (una soluzione), parallele distinte (nessuna soluzione), coincidenti (infinite soluzioni).</desc>
