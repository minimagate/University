<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="title desc">
<title id="title">Scomporre un vettore lungo due rette</title><desc id="desc">Due rette U e W per l&#x27;origine in R^2: ogni vettore z si scrive in un solo modo come u + w con u su U e w su W, tracciando le parallele.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="30.4" y1="152.04" x2="338.86" y2="182.89" stroke="#111" stroke-width="1.1"/>
<line x1="77.17" y1="232.95" x2="204.38" y2="-49.74" stroke="#111" stroke-width="1.1"/>
<line x1="250" y1="174" x2="300" y2="64" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="160" y1="50" x2="300" y2="64" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="110" y1="160" x2="250" y2="174" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="110" y1="160" x2="160" y2="50" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="110" y1="160" x2="300" y2="64" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<circle cx="110" cy="160" r="3" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="356.81" y="187.88" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">U</tspan></text>
<text x="216.49" y="-54.86" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">W</tspan></text>
<text x="250" y="194" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">u</tspan></text>
<text x="146" y="50" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">w</tspan></text>
<text x="330" y="58" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">z</tspan> = <tspan font-style="italic">u</tspan> + <tspan font-style="italic">w</tspan></text>
</g>
</svg>
