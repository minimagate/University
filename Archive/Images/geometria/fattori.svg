<svg xmlns="http://www.w3.org/2000/svg" width="620" height="110" viewBox="0 0 620 110" role="img" aria-labelledby="title desc">
<title id="title">Staccare una radice alla volta</title><desc id="desc">Un polinomio di grado n+1: ogni radice trovata stacca un fattore lineare e lascia un polinomio di grado più basso, finché resta solo la costante a.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<rect x="10" y="25" width="46" height="40" fill="#e4e4e4" stroke="#111" stroke-width="1" rx="6"/>
<line x1="60" y1="45" x2="82" y2="45" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<rect x="86" y="25" width="108" height="40" fill="white" stroke="#111" stroke-width="1" rx="6"/>
<line x1="198" y1="45" x2="220" y2="45" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<rect x="224" y="25" width="160" height="40" fill="white" stroke="#111" stroke-width="1" rx="6"/>
<line x1="388" y1="45" x2="410" y2="45" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<rect x="414" y="25" width="190" height="40" fill="white" stroke="#111" stroke-width="1" rx="6"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="33" y="51" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">P</tspan></text>
<text x="33" y="88" font-size="12" text-anchor="middle" fill="#111" font-style="italic">grado n + 1</text>
<text x="140" y="51" font-size="14" text-anchor="middle" fill="#111">(<tspan font-style="italic">z</tspan> − <tspan font-style="italic">z</tspan>₁) <tspan font-style="italic">Q</tspan></text>
<text x="140" y="88" font-size="12" text-anchor="middle" fill="#111" font-style="italic">Q di grado n</text>
<text x="304" y="51" font-size="14" text-anchor="middle" fill="#111">(<tspan font-style="italic">z</tspan> − <tspan font-style="italic">z</tspan>₁)(<tspan font-style="italic">z</tspan> − <tspan font-style="italic">z</tspan>₂) <tspan font-style="italic">Q</tspan>₂</text>
<text x="304" y="88" font-size="12" text-anchor="middle" fill="#111" font-style="italic">Q₂ di grado n − 1</text>
<text x="509" y="51" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">a</tspan>(<tspan font-style="italic">z</tspan> − <tspan font-style="italic">z</tspan>₁) ⋯ (<tspan font-style="italic">z</tspan> − <tspan font-style="italic">z</tspan><tspan font-style="italic" baseline-shift="-28%" font-size="9.8">n</tspan><tspan baseline-shift="-28%" font-size="9.8">+1</tspan>)</text>
<text x="509" y="88" font-size="12" text-anchor="middle" fill="#111" font-style="italic">tutto lineare</text>
</g>
</svg>
