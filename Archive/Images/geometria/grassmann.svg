<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-labelledby="title desc">
<title id="title">La formula di Grassmann</title><desc id="desc">Due ovali U e W che si sovrappongono: nella parte comune la base v1, ..., vq di U ∩ W; nella parte solo di U i vettori u che completano la base di U; nella parte solo di W i vettori w che completano quella di W.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="200" cy="95" rx="150" ry="75" fill="none" stroke="#111" stroke-width="1"/>
<ellipse cx="320" cy="95" rx="150" ry="75" fill="none" stroke="#111" stroke-width="1"/>
<clipPath id="cg"><ellipse cx="200" cy="95" rx="150" ry="75"/></clipPath>
<ellipse cx="320" cy="95" rx="150" ry="75" fill="#e4e4e4" clip-path="url(#cg)"/>
<ellipse cx="200" cy="95" rx="150" ry="75" fill="none" stroke="#111" stroke-width="1"/>
<ellipse cx="320" cy="95" rx="150" ry="75" fill="none" stroke="#111" stroke-width="1"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="70" y="30" font-size="16" text-anchor="middle" fill="#111"><tspan font-style="italic">U</tspan></text>
<text x="450" y="30" font-size="16" text-anchor="middle" fill="#111"><tspan font-style="italic">W</tspan></text>
<text x="260" y="80" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">v</tspan>₁, …, <tspan font-style="italic">v</tspan><tspan font-style="italic" baseline-shift="-28%" font-size="10.5">q</tspan></text>
<text x="260" y="106" font-size="12" text-anchor="middle" fill="#111" font-style="italic">base di U ∩ W</text>
<text x="120" y="90" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">u</tspan><tspan font-style="italic" baseline-shift="-28%" font-size="9.8">q</tspan><tspan baseline-shift="-28%" font-size="9.8">+1</tspan>, …, <tspan font-style="italic">u</tspan><tspan font-style="italic" baseline-shift="-28%" font-size="9.8">n</tspan></text>
<text x="400" y="90" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">w</tspan><tspan font-style="italic" baseline-shift="-28%" font-size="9.8">q</tspan><tspan baseline-shift="-28%" font-size="9.8">+1</tspan>, …, <tspan font-style="italic">w</tspan><tspan font-style="italic" baseline-shift="-28%" font-size="9.8">p</tspan></text>
<text x="260" y="192" font-size="13" text-anchor="middle" fill="#111" font-style="italic">q + (n − q) + (p − q) = n + p − q vettori</text>
</g>
</svg>
