<title id="title">Le radici di un polinomio reale sono simmetriche</title><desc id="desc">Radici di un polinomio a coefficienti reali nel piano complesso: le radici reali stanno sull&#x27;asse, le altre a coppie simmetriche rispetto all&#x27;asse reale, con la stessa molteplicità.</desc>
