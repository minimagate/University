<svg xmlns="http://www.w3.org/2000/svg" width="330" height="250" viewBox="0 0 330 250" role="img" aria-labelledby="title desc">
<title id="title">L&#x27;unione di due rette non è un sottospazio</title><desc id="desc">Due rette U e W per l&#x27;origine; u sta su U, w su W, ma u + w sta su una terza direzione e non appartiene all&#x27;unione.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<line x1="23.58" y1="179.1" x2="275.82" y2="116.05" stroke="#111" stroke-width="1.3"/>
<line x1="100.36" y1="263.26" x2="186.25" y2="17.86" stroke="#111" stroke-width="1.3"/>
<line x1="140" y1="150" x2="230" y2="127.5" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="140" y1="150" x2="172" y2="58" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="230" y1="127.5" x2="262" y2="35.5" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="172" y1="58" x2="262" y2="35.5" stroke="#111" stroke-width="0.7" stroke-dasharray="4 3"/>
<line x1="140" y1="150" x2="262" y2="35.5" stroke="#111" stroke-width="1.9" marker-end="url(#ah)"/>
<circle cx="140" cy="150" r="3" fill="#111" stroke="none" stroke-width="0"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="291.52" y="117.62" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">U</tspan></text>
<text x="195.55" y="12.42" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">W</tspan></text>
<text x="236" y="143.5" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">u</tspan></text>
<text x="158" y="62" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">w</tspan></text>
<text x="288" y="35.5" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">u</tspan> + <tspan font-style="italic">w</tspan></text>
</g>
</svg>
