<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc">
<title id="title">Le regioni dell’algoritmo a bandiera</title><desc id="desc">Due stati dell’array: nel primo le regioni sono minore di zero, non ancora esaminati e maggiore o uguale a zero; nel secondo ci sono quattro regioni, con i valori uguali a zero e maggiori di zero separati.</desc>
