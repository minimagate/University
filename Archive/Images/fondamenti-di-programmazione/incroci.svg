<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
<title id="title">Segmenti che si incrociano e segmenti che no</title><desc id="desc">A sinistra i segmenti AB e CD si incrociano nel punto E, che forma il triangolo grigio AED; a destra gli stessi quattro punti collegati da AD e CB non si incrociano.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<circle cx="60" cy="50" r="4.5" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="220" cy="50" r="4.5" fill="white" stroke="#111" stroke-width="1"/>
<circle cx="60" cy="160" r="4.5" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="220" cy="160" r="4.5" fill="white" stroke="#111" stroke-width="1"/>
<polygon points="60,50 140,105 220,50" fill="#e4e4e4" stroke="none" stroke-width="1"/>
<line x1="60" y1="50" x2="220" y2="160" stroke="#111" stroke-width="1"/>
<line x1="60" y1="160" x2="220" y2="50" stroke="#111" stroke-width="1"/>
<circle cx="140" cy="105" r="2.2" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="380" cy="50" r="4.5" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="540" cy="50" r="4.5" fill="white" stroke="#111" stroke-width="1"/>
<circle cx="380" cy="160" r="4.5" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="540" cy="160" r="4.5" fill="white" stroke="#111" stroke-width="1"/>
<line x1="380" y1="50" x2="540" y2="160" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="4,3"/>
<line x1="380" y1="160" x2="540" y2="50" stroke="#9a9a9a" stroke-width="0.7" stroke-dasharray="4,3"/>
<line x1="380" y1="50" x2="540" y2="50" stroke="#111" stroke-width="1"/>
<line x1="380" y1="160" x2="540" y2="160" stroke="#111" stroke-width="1"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="48" y="42" font-size="14" text-anchor="end" fill="#111"><tspan font-style="italic">A</tspan></text>
<text x="232" y="42" font-size="14" text-anchor="start" fill="#111"><tspan font-style="italic">D</tspan></text>
<text x="48" y="178" font-size="14" text-anchor="end" fill="#111"><tspan font-style="italic">C</tspan></text>
<text x="232" y="178" font-size="14" text-anchor="start" fill="#111"><tspan font-style="italic">B</tspan></text>
<text x="140" y="96" font-size="13" text-anchor="middle" fill="#111"><tspan font-style="italic">E</tspan></text>
<text x="130" y="214" font-size="13" text-anchor="middle" fill="#111">AB e CD si incrociano</text>
<text x="368" y="42" font-size="14" text-anchor="end" fill="#111"><tspan font-style="italic">A</tspan></text>
<text x="552" y="42" font-size="14" text-anchor="start" fill="#111"><tspan font-style="italic">D</tspan></text>
<text x="368" y="178" font-size="14" text-anchor="end" fill="#111"><tspan font-style="italic">C</tspan></text>
<text x="552" y="178" font-size="14" text-anchor="start" fill="#111"><tspan font-style="italic">B</tspan></text>
<text x="450" y="214" font-size="13" text-anchor="middle" fill="#111">AD e CB non si incrociano</text>
<text x="300" y="246" font-size="12" text-anchor="middle" fill="#111">● A, C     ○ B, D</text>
</g>
</svg>
