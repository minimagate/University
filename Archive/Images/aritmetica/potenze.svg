<svg xmlns="http://www.w3.org/2000/svg" width="620" height="215" viewBox="0 0 620 215" role="img" aria-labelledby="title desc">
<title id="title">Cicli di potenze</title><desc id="desc">A sinistra le potenze di 3 modulo 13 girano in un ciclo 1, 3, 9. A destra le potenze di 2 modulo 12: 1, 2 formano una coda e poi 4, 8 si ripetono.</desc>
