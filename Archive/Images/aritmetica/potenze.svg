<text x="203.69" y="148" font-size="15" text-anchor="middle" fill="#111">3</text>
<text x="96.31" y="148" font-size="15" text-anchor="middle" fill="#111">9</text>
<text x="150" y="117" font-size="14" text-anchor="middle" fill="#111" font-style="italic">× 3</text>
<text x="150" y="205" font-size="13" text-anchor="middle" fill="#111" font-style="italic">modulo 13: ritorna a 1 dopo 3 passi</text>
<text x="340" y="117" font-size="15" text-anchor="middle" fill="#111">1</text>
<text x="410" y="117" font-size="15" text-anchor="middle" fill="#111">2</text>
