<circle cx="560" cy="112" r="17" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="359" y1="112" x2="390" y2="112" stroke="#111" stroke-width="0.95" marker-end="url(#ah)"/>
<line x1="429" y1="112" x2="460" y2="112" stroke="#111" stroke-width="0.95" marker-end="url(#ah)"/>
