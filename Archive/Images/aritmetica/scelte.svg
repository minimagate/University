<text x="298" y="22" font-size="13" text-anchor="middle" fill="#111" font-style="italic">3 · 2 = 6 liste</text>
<text x="539" y="22" font-size="13" text-anchor="middle" fill="#111" font-style="italic">6 / 2! = 3 insiemi</text>
