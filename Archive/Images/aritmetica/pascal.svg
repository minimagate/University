<circle cx="197" cy="188" r="14" fill="#e4e4e4" stroke="#111" stroke-width="0.9"/>
<line x1="182.58" y1="167.31" x2="187.85" y2="174.87" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<line x1="211.42" y1="167.31" x2="206.15" y2="174.87" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
</g>
