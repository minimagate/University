<g stroke-linecap="round" stroke-linejoin="round">
<line x1="30" y1="150" x2="315" y2="150" stroke="#999" stroke-width="0.6" marker-end="url(#ah)"/>
<line x1="170" y1="278" x2="170" y2="15" stroke="#999" stroke-width="0.6" marker-end="url(#ah)"/>
<circle cx="170" cy="150" r="100" fill="none" stroke="#111" stroke-width="0.9"/>
<polygon points="270,150 220,63.4 120,63.4 70,150 120,236.6 220,236.6" fill="none" stroke="#777" stroke-width="0.6"/>
