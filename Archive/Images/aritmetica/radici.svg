<circle cx="70" cy="150" r="4.2" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="120" cy="236.6" r="4.2" fill="#111" stroke="none" stroke-width="0"/>
<circle cx="220" cy="236.6" r="4.2" fill="#111" stroke="none" stroke-width="0"/>
<path d="M212,150 A42,42 0 0 0 191.0,113.6" fill="none" stroke="#111" stroke-width="1" marker-end="url(#ah)"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="294" y="155" font-size="14" text-anchor="middle" fill="#111">1</text>
<text x="232" y="49.34" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">ζ</tspan></text>
<text x="108" y="49.34" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">ζ</tspan><tspan baseline-shift="38%" font-size="9.8">2</tspan></text>
<text x="24" y="155" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">ζ</tspan><tspan baseline-shift="38%" font-size="9.8">3</tspan> = −1</text>
<text x="108" y="260.66" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">ζ</tspan><tspan baseline-shift="38%" font-size="9.8">4</tspan></text>
<text x="232" y="260.66" font-size="14" text-anchor="middle" fill="#111"><tspan font-style="italic">ζ</tspan><tspan baseline-shift="38%" font-size="9.8">5</tspan></text>
<text x="220" y="132" font-size="12" text-anchor="start" fill="#111" font-style="italic">60°</text>
