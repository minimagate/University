<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300" role="img" aria-labelledby="title desc">
<title id="title">Le radici seste dell’unità</title><desc id="desc">Sei punti equidistanti sul cerchio di raggio 1, da 1 a ζ alla quinta; una freccia mostra la rotazione di 60 gradi da 1 a ζ.</desc>
