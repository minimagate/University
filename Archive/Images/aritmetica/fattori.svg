<title id="title">Albero dei fattori di 360</title><desc id="desc">Il numero 360 si spezza in 12 per 30; 12 in 3 per 4 e 4 in 2 per 2; 30 in 5 per 6 e 6 in 2 per 3. Le foglie sono primi.</desc>
