<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
<title id="title">Inclusione-esclusione</title><desc id="desc">Tre cerchi A, B, C. In ogni zona il conto con segni alterni dà sempre 1.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<circle cx="150" cy="98" r="70" fill="none" stroke="#111" stroke-width="1"/>
<circle cx="230" cy="98" r="70" fill="none" stroke="#111" stroke-width="1"/>
<circle cx="190" cy="166" r="70" fill="none" stroke="#111" stroke-width="1"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="78" y="34" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">A</tspan></text>
<text x="302" y="34" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">B</tspan></text>
<text x="190" y="248" font-size="15" text-anchor="middle" fill="#111"><tspan font-style="italic">C</tspan></text>
<text x="118" y="92" font-size="15" text-anchor="middle" fill="#111">1</text>
<text x="262" y="92" font-size="15" text-anchor="middle" fill="#111">1</text>
<text x="190" y="210" font-size="15" text-anchor="middle" fill="#111">1</text>
<text x="190" y="76" font-size="13" text-anchor="middle" fill="#111">2 − 1</text>
<text x="150" y="162" font-size="13" text-anchor="middle" fill="#111">2 − 1</text>
<text x="232" y="162" font-size="13" text-anchor="middle" fill="#111">2 − 1</text>
<text x="190" y="126" font-size="12" text-anchor="middle" fill="#111">3 − 3 + 1</text>
<text x="340" y="70" font-size="14" text-anchor="start" fill="#111" font-style="italic">ogni elemento dell’unione</text>
<text x="340" y="90" font-size="14" text-anchor="start" fill="#111" font-style="italic">viene contato esattamente una volta:</text>
<text x="340" y="130" font-size="14" text-anchor="start" fill="#111">|<tspan font-style="italic">A</tspan> ∪ <tspan font-style="italic">B</tspan> ∪ <tspan font-style="italic">C</tspan>| = |<tspan font-style="italic">A</tspan>| + |<tspan font-style="italic">B</tspan>| + |<tspan font-style="italic">C</tspan>|</text>
<text x="392" y="154" font-size="14" text-anchor="start" fill="#111">− |<tspan font-style="italic">A</tspan> ∩ <tspan font-style="italic">B</tspan>| − |<tspan font-style="italic">A</tspan> ∩ <tspan font-style="italic">C</tspan>| − |<tspan font-style="italic">B</tspan> ∩ <tspan font-style="italic">C</tspan>|</text>
<text x="392" y="178" font-size="14" text-anchor="start" fill="#111">+ |<tspan font-style="italic">A</tspan> ∩ <tspan font-style="italic">B</tspan> ∩ <tspan font-style="italic">C</tspan>|</text>
</g>
</svg>
