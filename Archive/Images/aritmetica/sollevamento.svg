<svg xmlns="http://www.w3.org/2000/svg" width="620" height="210" viewBox="0 0 620 210" role="img" aria-labelledby="title desc">
<title id="title">Tre destini di una radice</title><desc id="desc">Tre alberi. x² ≡ 6: le radici 1 e 4 modulo 5 hanno un solo sollevamento, 16 e 9 modulo 25. x² ≡ 0 modulo 9: la radice 0 modulo 3 ha tre sollevamenti. x² ≡ 3 modulo 9: la radice 0 non si solleva.</desc>
<defs><marker id="ah" viewBox="0 0 10 8" refX="9.2" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.6 L10,4 L0,7.4 L2.4,4 Z" fill="#111"/></marker><marker id="ahs" viewBox="0 0 10 8" refX="0.8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.6 L0,4 L10,7.4 L7.6,4 Z" fill="#111"/></marker></defs>
<g stroke-linecap="round" stroke-linejoin="round">
<circle cx="70" cy="70" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="70" y1="89" x2="70" y2="131" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<circle cx="70" cy="150" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<circle cx="150" cy="70" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="150" y1="89" x2="150" y2="131" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<circle cx="150" cy="150" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="230" y1="30" x2="230" y2="190" stroke="#bbb" stroke-width="0.5" stroke-dasharray="3 4"/>
<circle cx="330" cy="70" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="319.1" y1="85.57" x2="284.9" y2="134.43" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<circle cx="274" cy="150" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="330" y1="89" x2="330" y2="131" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<circle cx="330" cy="150" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="340.9" y1="85.57" x2="375.1" y2="134.43" stroke="#111" stroke-width="0.9" marker-end="url(#ah)"/>
<circle cx="386" cy="150" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="430" y1="30" x2="430" y2="190" stroke="#bbb" stroke-width="0.5" stroke-dasharray="3 4"/>
<circle cx="525" cy="70" r="18" fill="white" stroke="#111" stroke-width="0.95"/>
<line x1="525" y1="89" x2="525" y2="128" stroke="#111" stroke-width="0.9" stroke-dasharray="3 4"/>
</g>
<g font-family="'STIX Two Text', 'STIX Two Math', 'Times New Roman', serif">
<text x="110" y="22" font-size="13" text-anchor="middle" fill="#111" font-style="italic">x² ≡ 6: da mod 5 a mod 25</text>
<text x="70" y="75" font-size="15" text-anchor="middle" fill="#111">1</text>
<text x="70" y="155" font-size="15" text-anchor="middle" fill="#111">16</text>
<text x="150" y="75" font-size="15" text-anchor="middle" fill="#111">4</text>
<text x="150" y="155" font-size="15" text-anchor="middle" fill="#111">9</text>
<text x="110" y="196" font-size="12" text-anchor="middle" fill="#111" font-style="italic">un ramo per radice</text>
<text x="330" y="22" font-size="13" text-anchor="middle" fill="#111" font-style="italic">x² ≡ 0: da mod 3 a mod 9</text>
<text x="330" y="75" font-size="15" text-anchor="middle" fill="#111">0</text>
<text x="274" y="155" font-size="15" text-anchor="middle" fill="#111">0</text>
<text x="330" y="155" font-size="15" text-anchor="middle" fill="#111">3</text>
<text x="386" y="155" font-size="15" text-anchor="middle" fill="#111">6</text>
<text x="330" y="196" font-size="12" text-anchor="middle" fill="#111" font-style="italic">tre rami</text>
<text x="525" y="22" font-size="13" text-anchor="middle" fill="#111" font-style="italic">x² ≡ 3: da mod 3 a mod 9</text>
<text x="525" y="75" font-size="15" text-anchor="middle" fill="#111">0</text>
<text x="525" y="152" font-size="26" text-anchor="middle" fill="#111">×</text>
<text x="525" y="196" font-size="12" text-anchor="middle" fill="#111" font-style="italic">nessun ramo</text>
</g>
</svg>
